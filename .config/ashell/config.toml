[modules]
left = [ [ "AppLauncher", "Workspaces" ] ]
center = [ "WindowTitle" ]
right = [ ["MediaPlayer", "Settings", "Updates"], [ "Tempo" ] ]


[[CustomModule]]
name = "AppLauncher"
type = "Button"
icon = ""
command = "walker"


[media_player]
max_title_length = 25
indicator_format = "Icon"


[tempo]
clock_format = "%I:%M %p"


[window_title]
mode = "Class"
truncate_title_after_length = 25


[updates]
check_cmd = "checkupdates; yay -Qu" 
update_cmd = 'alacritty -e bash -c "arch-update" &'


[settings]
indicators = [ "IdleInhibitor", "PowerProfile", "Audio", "Microphone", "Network", "Vpn" ]

peripheral_indicators = { Specific = ["Gamepad", "Keyboard"] }

brightness_indicator_format = "Icon"
audio_indicator_format = "IconAndPercentage"
microphone_indicator_format = "IconAndPercentage"
network_indicator_format = "IconAndPercentage"


[appearance]
scale_factor = 1.20
font_name = "SF Pro Text"

primary_color = "#7aa2f7"
success_color = "#9ece6a"
text_color = "#a9b1d6"

workspace_colors = [ "#7aa2f7", "#9ece6a" ]

[appearance.danger_color]
base = "#f7768e"
weak = "#e0af68"

[appearance.background_color]
base = "#1a1b26"
weak = "#24273a"
strong = "#414868"

[appearance.secondary_color]
base = "#0c0d14"
