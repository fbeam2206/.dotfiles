# TRILIUM
windowrule {
  name = windowrule-17
  float = on
  size = 1200 800
  workspace = special:scratch
  move = ((monitor_w*0.05)) ((monitor_h*0.05))
  no_initial_focus = on
  match:class = ^(trilium)(.*)$
}


# OBSIDIAN
windowrule {
  name = obsidian
  float = on
  size = 1200 800
  workspace = special:scratch
  move = ((monitor_w*0.05)) ((monitor_h*0.05))
  no_initial_focus = on
  match:class = ^(obsidian)(.*)$
}


