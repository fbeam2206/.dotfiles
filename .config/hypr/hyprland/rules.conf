#----------------------------#
#-- WINDOWS AND WORKSPACES --#
#----------------------------#

windowrule {
  name = windowrule-0
  float = on
  match:title = ^(MyApp)(.*)$
}


# Pause Hypridle when app in fullscreen
windowrule {
  name = windowrule-1
  idle_inhibit = fullscreen
  suppress_event = maximize
  match:class = .*
}


# Ignore maximize requests from apps. You'll probably like this.

# Fix some dragging issues with XWayland
#windowrulev2 = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:

# STEAM 
windowrule {
  name = windowrule-2
  workspace = 3
  match:class = ^(steam)$
}

windowrule {
  name = windowrule-3
  float = on
  match:title = ^(Friends List)(.*)$ # FLOAT Steam Friends List
}

windowrule {
  name = windowrule-4
  size = 350 800
  no_initial_focus = on
  match:title = ^(Friends List)(.*)$
}

windowrule {
  name = windowrule-5
  no_initial_focus = on
  match:title = ^(Launching...)(.*)$
}

# Games open on regular workspace 1: a special workspace blocks Hyprland's
# solitary/direct-scanout path (SPECIAL/WORKSPACES blockers). content = game
# tags the surface so render:direct_scanout=auto considers it (XWayland
# clients cannot tag themselves).
windowrule {
  name = windowrule-6
  monitor = DP-5
  workspace = 1
  tile = on
  fullscreen = on
  immediate = 1
  no_anim = on
  content = game
  match:class = ^(steam_app_)(.*)$
}

windowrule {
  name = windowrule-7
  workspace = 1
  tile = on
  fullscreen = on
  monitor = DP-5
  immediate = 1
  no_anim = on
  content = game
  match:class = ^(cs2)(.*)$
}



#----- MISC APPS -----#

# CORECTRL 
