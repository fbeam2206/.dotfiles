# Layer Rules
layerrule {
  name = layerrule-1
  blur = on
  ignore_alpha = 0.5
  match:namespace = swaync-control-center
}

layerrule {
  name = layerrule-2
  blur = on
  ignore_alpha = 0.5
  match:namespace = swaync-notification-window
}

layerrule {
  name = layerrule-3
  blur = on
  match:namespace = ^(syspower)(.*)$
}

layerrule {
  name = layerrule-4
  ignore_alpha = 0
  match:namespace = ^(waybar)(.*)$
}

windowrule {
  name = windowrule-42
  no_blur = on
  tile = on
  match:class = ^(Chromium)(.*)$
}


